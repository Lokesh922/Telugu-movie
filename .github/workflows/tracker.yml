name: Telugu Movie Tracker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# --- ADDED THIS PERMISSIONS BLOCK TO FIX THE 403 ERROR ---
permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run tracker script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Commit and push changes if any new movies found
        run: |
          git config --global user.name 'Movie Tracker Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add seen_movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen movies cache" && git push)
          
